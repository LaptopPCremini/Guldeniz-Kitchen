<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güldeniz Düz Kitchen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --primary: #e67e22; 
            --bg: #f8f9fa; 
            --intl: #2980b9; 
            --turkish: #c0392b; 
            --dessert: #d81b60; 
            --cake: #6d4c41; 
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 0; margin: 0; }
        
        .card { background: white; width: 100%; max-width: 450px; min-height: 100vh; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid #eee; position: relative; overflow: hidden; }
        
        .banner-container { cursor: pointer; width: 100%; position: relative; z-index: 1001; background: white; }
        .app-banner { width: 100%; height: auto; display: block; }

        /* TEXT SCHUTZ: Verhindert Markieren und Klicks auf Text (gegen Popups) */
        .content, h2, h3, li, .steps, .origin-info {
            pointer-events: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* BUTTON SCHUTZ: Müssen klickbar sein und dürfen NICHT übersetzt werden */
        .action-btn, .menu-btn, .lang-btn, .banner-container, .save-pdf-btn, .back-btn {
            pointer-events: auto !important;
            user-select: auto !important;
        }

        /* Google Translate Elemente verstecken */
        .goog-te-balloon-frame, #goog-gt-tt, .goog-te-tip, .goog-te-gadget-icon { display: none !important; visibility: hidden !important; }
        #google_translate_element { display: none !important; }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }

        #main-menu { padding: 25px; text-align: center; }
        .menu-btn {
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            margin-bottom: 15px; padding: 20px; border-radius: 20px; color: white;
            text-decoration: none; font-size: 1.2rem; font-weight: bold; border: none; width: 100%; cursor: pointer;
        }
        
        .edition-header { width: 100%; height: 50px; display: flex; justify-content: center; align-items: center; border-bottom: 3px solid #eee; }
        .content { padding: 20px; }
        .meal-pic { width: 100%; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); pointer-events: none; }
        h2 { color: #2c3e50; text-align: center; margin: 10px 0; font-size: 1.6rem; }
        
        .header-with-btn { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-top: 25px; padding-bottom: 5px; pointer-events: auto !important; }
        .header-with-btn h3 { border-bottom: none; margin: 0; color: var(--primary); }
        
        .save-pdf-btn { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

        ul { padding: 0; list-style: none; }
        li { padding: 10px 0; border-bottom: 1px solid #f9f9f9; font-size: 1.05rem; }
        .steps { line-height: 1.7; font-size: 1.05rem; background: #fffcf9; padding: 15px; border-radius: 15px; border: 1px solid #ffeada; white-space: pre-line; }
        
        .action-btn { color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .back-btn { background: #95a5a6; margin-top: 10px; }
        #loader { text-align: center; padding: 50px; font-weight: bold; }

        .language-drawer { background: #ffffff; width: 100%; display: flex; justify-content: center; gap: 25px; padding: 0; max-height: 0; overflow: hidden; transition: all 0.4s ease-in-out; }
        .language-drawer.open { padding: 15px 0; max-height: 80px; border-bottom: 1px solid #eee; }
        .lang-btn { cursor: pointer; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: #f8f9fa; }
    </style>
</head>
<body>

<div class="card">
    <div class="banner-container" onclick="toggleLanguages()">
        <img src="https://drive.google.com/thumbnail?id=18q_Gy1muj9SkApuQHxz991F3LCoXaE-V&sz=w1000" class="app-banner">
    </div>

    <div id="langDrawer" class="language-drawer notranslate" translate="no">
        <div class="lang-btn" onclick="changeLanguage('tr')">🇹🇷</div>
        <div class="lang-btn" onclick="changeLanguage('de')">🇩🇪</div>
        <div class="lang-btn" onclick="changeLanguage('en')">🇺🇸</div>
    </div>

    <div id="google_translate_element"></div>

    <div id="main-menu" class="notranslate" translate="no">
        <h2 style="margin-bottom: 25px;" class="notranslate">Hoş geldin Anne! ❤️</h2>
        <button class="menu-btn" style="background: var(--intl);" onclick="startApp('intl')"><span>🌍</span> International recipes</button>
        <button class="menu-btn" style="background: var(--turkish);" onclick="startApp('turkish')"><span>🇹🇷</span> Turkish recipes</button>
        <button class="menu-btn" style="background: var(--dessert);" onclick="startApp('dessert')"><span>🍭</span> Dessert recipes</button>
        <button class="menu-btn" style="background: var(--cake);" onclick="startApp('cake')"><span>🎂</span> Cake recipes</button>
    </div>

    <div id="app-view" style="display:none;">
        <div id="edition-header-box" class="edition-header notranslate" translate="no">
            <span id="header-text" style="color:white; font-weight:bold; font-size:1.2rem;"></span>
        </div>
        
        <div id="loader">Yükleniyor... 👩‍🍳</div>
        
        <div id="content" class="content" style="display:none">
            <div id="recipe-to-print">
                <h2 id="name"></h2>
                <span id="origin" class="origin-info"></span>
                <img id="pic" class="meal-pic" src="" crossorigin="anonymous">
                
                <div class="header-with-btn">
                    <h3>Ingredients</h3>
                    <button class="save-pdf-btn notranslate" translate="no" onclick="saveAsPDF()">💾 PDF</button>
                </div>
                <ul id="ing"></ul>
                
                <h3>Preparation</h3>
                <div id="step" class="steps"></div>
            </div>
            
            <button id="next-btn" class="action-btn notranslate" translate="no" onclick="getRecipe()">Yeni Tarif ✅</button>
            <button class="action-btn back-btn notranslate" translate="no" onclick="showMenu()">⬅️ Ana Menü</button>
        </div>
    </div>
</div>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'tr,de,en', autoDisplay: false}, 'google_translate_element');
    }

    function toggleLanguages() { document.getElementById('langDrawer').classList.toggle('open'); }

    function changeLanguage(langCode) {
        var select = document.querySelector('.goog-te-combo');
        if (select) { select.value = langCode; select.dispatchEvent(new Event('change')); }
        setTimeout(toggleLanguages, 500);
    }

    async function saveAsPDF() {
        const element = document.getElementById('recipe-to-print');
        const recipeName = document.getElementById('name').innerText || 'recipe';
        
        // Sperre kurz lösen
        const originalPointer = element.style.pointerEvents;
        element.style.pointerEvents = "auto";
        
        const opt = {
            margin: 10,
            filename: recipeName + '.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.style.pointerEvents = originalPointer;
        });
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    let currentMode = '';
    const forbidden = ["pork", "lard", "gelatin", "bacon", "ham", "shrimp", "prawn", "crab", "lobster", "seafood", "shellfish", "rabbit", "frog", "snail", "wine", "alcohol", "liquor"];
    const cakeKeys = ["cake", "tart", "pie", "torte", "brownies", "gateau", "cheesecake"];

    function convertToMetric(text) {
        if(!text) return "";
        let t = text;
        t = t.replace(/(\d+)\s*(F|degrees Fahrenheit|°F)/gi, (m, f) => Math.round((f - 32) * 5 / 9) + "°C");
        t = t.replace(/(\d+(\.\d+)?)\s*(lb|lbs|pound)/gi, (m, lb) => Math.round(lb * 453) + "g");
        t = t.replace(/(\d+(\.\d+)?)\s*(oz|ounce)/gi, (m, oz) => Math.round(oz * 28) + "g");
        t = t.replace(/(\d+(\.\d+)?)\s*(cup|cups)/gi, (m, cup) => Math.round(cup * 240) + "ml");
        return t;
    }

    function showMenu() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('app-view').style.display = 'none';
    }

    function startApp(mode) {
        currentMode = mode;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        const header = document.getElementById('header-text');
        const box = document.getElementById('edition-header-box');

        if(mode === 'intl') { header.textContent = "🌍 International recipes"; box.style.backgroundColor = "#2980b9"; }
        else if(mode === 'turkish') { header.textContent = "🇹🇷 Turkish recipes"; box.style.backgroundColor = "#c0392b"; }
        else if(mode === 'dessert') { header.textContent = "🍭 Dessert recipes"; box.style.backgroundColor = "#d81b60"; }
        else { header.textContent = "🎂 Cake recipes"; box.style.backgroundColor = "#6d4c41"; }
        getRecipe();
    }

    async function getRecipe() {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('content').style.display = 'none';
        try {
            let url = '';
            if(currentMode === 'turkish') url = 'https://www.themealdb.com/api/json/v1/1/filter.php?a=Turkish';
            else if(currentMode === 'dessert' || currentMode === 'cake') url = 'https://www.themealdb.com/api/json/v1/1/filter.php?c=Dessert';
            else url = 'https://www.themealdb.com/api/json/v1/1/random.php';

            const res = await fetch(url);
            const data = await res.json();
            let mealsList = data.meals;

            if(currentMode === 'cake') {
                mealsList = mealsList.filter(m => cakeKeys.some(k => m.strMeal.toLowerCase().includes(k)));
            }

            const randomMeal = mealsList[Math.floor(Math.random() * mealsList.length)];
            const detRes = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${randomMeal.idMeal}`);
            const detData = await detRes.json();
            const meal = detData.meals[0];

            if (forbidden.some(w => (meal.strMeal + meal.strInstructions).toLowerCase().includes(w))) return getRecipe();

            document.getElementById('name').innerText = meal.strMeal;
            document.getElementById('pic').src = meal.strMealThumb;
            document.getElementById('step').innerText = convertToMetric(meal.strInstructions);
            document.getElementById('origin').innerText = (meal.strArea || "Dünya") + " Mutfağı";

            let ings = "";
            for(let i=1; i<=20; i++) {
                if(meal["strIngredient"+i]) {
                    ings += `<li>${convertToMetric(meal["strMeasure"+i])} ${meal["strIngredient"+i]}</li>`;
                }
            }
            document.getElementById('ing').innerHTML = ings;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        } catch (e) {
            setTimeout(getRecipe, 2000);
        }
    }
</script>
</body>
</html>
