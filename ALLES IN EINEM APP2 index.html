<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güldeniz Düz Kitchen - All Editions</title>
    <style>
        :root { 
            --primary: #e67e22; 
            --bg: #f8f9fa; 
            --turkish: #c0392b; 
            --dessert: #d81b60; 
            --cake: #6d4c41; 
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 0; margin: 0; }
        .card { background: white; width: 100%; max-width: 450px; min-height: 100vh; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid #eee; position: relative; }
        .app-banner { width: 100%; height: auto; display: block; }
        
        /* Menu Styles */
        #main-menu { padding: 25px; text-align: center; }
        .menu-btn {
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            margin-bottom: 20px; padding: 25px; border-radius: 20px; color: white;
            text-decoration: none; font-size: 1.3rem; font-weight: bold; border: none; width: 100%; cursor: pointer;
        }
        .menu-btn span { font-size: 2rem; margin-bottom: 5px; }
        
        /* Edition Header */
        .edition-header { width: 100%; height: 50px; display: flex; justify-content: center; align-items: center; border-bottom: 3px solid #eee; }

        /* Recipe Content */
        .content { padding: 20px; }
        .meal-pic { width: 100%; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin: 10px 0; font-size: 1.6rem; }
        .origin-info { text-align: center; font-weight: bold; display: block; margin-bottom: 15px; }
        h3 { border-bottom: 2px solid #eee; color: var(--primary); padding-bottom: 5px; margin-top: 25px; }
        ul { padding: 0; list-style: none; }
        li { padding: 10px 0; border-bottom: 1px solid #f9f9f9; font-size: 1.05rem; }
        .steps { line-height: 1.7; font-size: 1.05rem; background: #fffcf9; padding: 15px; border-radius: 15px; border: 1px solid #ffeada; white-space: pre-line; }
        
        .action-btn { color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .back-btn { background: #95a5a6; margin-top: 10px; }
        #loader { text-align: center; padding: 50px; font-weight: bold; }
        
        /* Erklärungs-Text Style */
        .explanation { color: #e67e22; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://drive.google.com/thumbnail?id=18q_Gy1muj9SkApuQHxz991F3LCoXaE-V&sz=w1000" class="app-banner">

    <div id="main-menu">
        <h2 style="margin-bottom: 30px;">Hoş geldin Anne! ❤️</h2>
        <button class="menu-btn" style="background: var(--turkish);" onclick="startApp('turkish')">
            <span>🇹🇷</span> Turkish Edition
        </button>
        <button class="menu-btn" style="background: var(--dessert);" onclick="startApp('dessert')">
            <span>🍭</span> Dessert Edition
        </button>
        <button class="menu-btn" style="background: var(--cake);" onclick="startApp('cake')">
            <span>🎂</span> Torten Edition
        </button>
    </div>

    <div id="app-view" style="display:none;">
        <div id="edition-header-box" class="edition-header">
            <svg id="svg-header" width="300" height="40" viewBox="0 0 300 40" xmlns="http://www.w3.org/2000/svg">
                <text id="header-text" x="50%" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="white"></text>
            </svg>
        </div>

        <div id="loader">Yükleniyor... 👩‍🍳</div>

        <div id="content" class="content" style="display:none">
            <h2 id="name"></h2>
            <span id="origin" class="origin-info"></span>
            <img id="pic" class="meal-pic" src="">
            <h3>Ingredients (Metric)</h3>
            <ul id="ing"></ul>
            <h3>Preparation</h3>
            <div id="step" class="steps"></div>
            
            <button id="next-btn" class="action-btn" onclick="getRecipe()">Yeni Tarif ✅</button>
            <button class="action-btn back-btn" onclick="showMenu()">⬅️ Ana Menü</button>
        </div>
    </div>
</div>

<script>
    let currentMode = '';
    const forbidden = ["pork", "lard", "gelatin", "bacon", "ham", "shrimp", "prawn", "crab", "lobster", "seafood", "shellfish", "rabbit", "frog", "snail"];
    const cakeKeys = ["cake", "tart", "pie", "torte", "brownies", "gateau", "cheesecake"];

    // Wörterbuch für Erklärungen fremder Begriffe
    const explanations = {
        "aebleskiver": " (Danish mini pancakes / Danimarka mini krebi)",
        "poutine": " (Fries with gravy / Soslu patates kızartması)",
        "mochi": " (Japanese rice cake / Japon pirinç keki)",
        "bakewell tart": " (British almond tart / İngiliz bademli tartı)",
        "eton mess": " (Cream and berry dessert / Kremalı meyveli tatlı)",
        "galette": " (French flat cake / Fransız yassı keki)",
        "ganache": " (Chocolate-cream glaze / Çikolata kreması)",
        "polenta": " (Cornmeal porridge / Mısır irmiği lapası)",
        "couscous": " (Wheat semolina / İrmik bulguru)",
        "guacamole": " (Avocado dip / Avokado sosu)"
    };

    function addExplanations(text) {
        let lowerText = text.toLowerCase();
        for (let key in explanations) {
            if (lowerText.includes(key)) {
                return text + `<span class="explanation">${explanations[key]}</span>`;
            }
        }
        return text;
    }

    function convertToMetric(text) {
        if(!text) return "";
        let t = text;
        t = t.replace(/(\d+)\s*(F|degrees Fahrenheit|°F)/gi, (m, f) => Math.round((f - 32) * 5 / 9) + "°C");
        t = t.replace(/(\d+(\.\d+)?)\s*(lb|lbs|pound)/gi, (m, lb) => Math.round(lb * 453) + "g");
        t = t.replace(/(\d+(\.\d+)?)\s*(oz|ounce)/gi, (m, oz) => Math.round(oz * 28) + "g");
        t = t.replace(/(\d+(\.\d+)?)\s*(cup|cups)/gi, (m, cup) => Math.round(cup * 240) + "ml");
        return t;
    }

    function showMenu() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('app-view').style.display = 'none';
        window.scrollTo(0,0);
    }

    function startApp(mode) {
        currentMode = mode;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        
        const header = document.getElementById('header-text');
        const box = document.getElementById('edition-header-box');
        const nextBtn = document.getElementById('next-btn');

        if(mode === 'turkish') {
            header.textContent = "🇹🇷 Turkish Edition 🇹🇷";
            box.style.backgroundColor = "#c0392b";
            nextBtn.style.backgroundColor = "#c0392b";
        } else if(mode === 'dessert') {
            header.textContent = "🍭 Dessert Edition 🍭";
            box.style.backgroundColor = "#d81b60";
            nextBtn.style.backgroundColor = "#d81b60";
        } else {
            header.textContent = "🎂 Torten Edition 🎂";
            box.style.backgroundColor = "#6d4c41";
            nextBtn.style.backgroundColor = "#6d4c41";
        }
        getRecipe();
    }

    async function getRecipe() {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('content').style.display = 'none';
        window.scrollTo(0,0);
        
        try {
            let url = (currentMode === 'turkish') 
                ? 'https://www.themealdb.com/api/json/v1/1/filter.php?a=Turkish' 
                : 'https://www.themealdb.com/api/json/v1/1/filter.php?c=Dessert';

            const res = await fetch(url);
            const data = await res.json();
            let list = data.meals;

            if(currentMode === 'cake') {
                list = list.filter(m => cakeKeys.some(k => m.strMeal.toLowerCase().includes(k)));
            }

            const randomMeal = list[Math.floor(Math.random() * list.length)];
            const detRes = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${randomMeal.idMeal}`);
            const detData = await detRes.json();
            const meal = detData.meals[0];

            if (forbidden.some(w => (meal.strMeal + meal.strInstructions).toLowerCase().includes(w))) return getRecipe();

            // Name mit Erklärung
            document.getElementById('name').innerHTML = addExplanations(meal.strMeal);
            document.getElementById('pic').src = meal.strMealThumb;
            document.getElementById('step').innerText = convertToMetric(meal.strInstructions);
            document.getElementById('origin').innerText = (currentMode === 'turkish') ? "Geleneksel Türk Mutfağı" : "Dünya Mutfağı Seçimi";

            let ings = "";
            for(let i=1; i<=20; i++) {
                let ingredient = meal["strIngredient"+i];
                let measure = meal["strMeasure"+i];
                if(ingredient && ingredient.trim() !== "") {
                    let metricMeasure = convertToMetric(measure);
                    // Zutat mit Erklärung prüfen
                    let finalIngredient = addExplanations(ingredient);
                    ings += `<li>${metricMeasure} ${finalIngredient}</li>`;
                }
            }
            document.getElementById('ing').innerHTML = ings;
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        } catch (e) {
            document.getElementById('loader').innerText = "Hata! Lütfen tekrar deneyin.";
        }
    }
</script>
</body>
</html>
